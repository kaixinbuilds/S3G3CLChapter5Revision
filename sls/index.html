function doneLevel(){
  const L = LEVELS[S.lv], sc = lvScore(S.lv), mx = lvMax(S.lv);
  SFX.level();
  const allDone = LEVELS.every((_,i)=>lvDone(i));
  const band = (sc === mx ? '全对 —— 这一关的每一张卡片你都是一次就放对的。'
             : sc >= mx*0.7 ? '不错。放错的那几张，回头再看一次课文就清楚了。'
             : '这一关可以再做一次 —— 分数会取最好的一次。') +
    (allDone
      ? (summited() ? '<br>三关都做完了，也过了登顶线，可以登顶了。'
                    : '<br>三关都做完了，离登顶线还差 <b>' + (PASS - total()) + ' 分</b>。')
      : '<br>登顶线是 <b>' + PASS + '</b> 分，目前 <b>' + total() + '</b> 分。');
  paintScr('scrDone',
    '<h1>' + esc(L.n) + ' 完成</h1>' +
    '<h2>' + esc(L.t) + '</h2>' +
    '<p style="font-size:15px;color:#fff">得分 <b style="color:var(--gold)">' + sc + ' / ' + mx + '</b>' +
      '　总分 <b style="color:var(--green)">' + total() + ' / ' + MAX + '</b></p>' +
    '<p>' + zh(band) + '</p>' +
    '<div class="row">' +
      '<button class="btn ghost" id="dAgain" type="button">再做一次 Retry</button>' +
      '<button class="btn" id="dNext" type="button">' +
        (LEVELS.every((_,i)=>lvDone(i))
          ? (summited() ? '🏔️ 登顶 Summit' : '看看还差多少 How far?')
          : '选关 Levels') + '</button>' +
    '</div>');
  $('dAgain').addEventListener('click', ()=>{ S.pi = 0; renderPanel(); });
  $('dNext').addEventListener('click', ()=>{
    LEVELS.every((_,i)=>lvDone(i)) ? scrTopShow() : scrMenuShow();
  });
}

/* ──────── 登顶画面 ｜ the summit ────────
   没有下载按钮：SLS 的 iframe sandbox 里下载不可靠，而且官方禁用外部函式库
   （html2canvas 用不了）。以装置原生截图为准 —— 截图会把 SLS 页面一并拍进去，
   反而可以佐证学生确实是在登入状态下作答的。
   No download button: downloads are unreliable inside the SLS sandbox and
   external libraries are barred, so html2canvas is out. The device's own
   screenshot is the mechanism — and it catches the surrounding SLS page too,
   which is itself evidence the student was logged in. */
/* ──────── 还差一点 ｜ short of the summit ────────
   三关都做完，但总分不到门槛。人物停在小路上，没到旗子。
   给的是一条明路：哪一关最弱、还差几分、一个按钮直接重做那一关。
   重做取最好的一次，所以再试一定不亏 —— 这一点要写在画面上，
   不然学生会以为重做可能把分数弄低。
   All three levels done but short of the threshold. The character stands on the
   trail, not at the flag. What it gives is a way forward: which level is
   weakest, how many marks short, and a button straight into that level. Retries
   keep the best attempt, so trying again can never cost anything — which has to
   be said on screen, or students assume a retry might lower their score. */
function scrNearShow(){
  const w = weakestLevel(), gap = PASS - total();
  paintScr('scrNear',
    '<h1>⛰️ 还差一点就到顶了</h1>' +
    '<p class="sub" style="font-size:13px;color:#fff">目前 <b style="color:var(--gold)">' +
      total() + ' / ' + MAX + '</b>　·　登顶需要 <b style="color:var(--gold)">' + PASS +
      ' 分</b>，还差 <b style="color:#ffb3b3">' + gap + ' 分</b></p>' +
    '<div class="lvchips">' + LEVELS.map((L,i)=>
      '<div class="lvchip' + (i===w ? ' weak' : '') + '"><b>' + esc(L.n) + '</b>' +
      '<span>' + lvScore(i) + ' / ' + lvMax(i) + '</span>' +
      '<small>' + (i===w ? '最弱的一关' : Math.round(lvScore(i)/Math.max(1,lvMax(i))*100) + '%') +
      '</small></div>').join('') + '</div>' +
    '<p class="sub" style="font-size:11px">重做取<b>最好的一次</b>成绩 —— 再试一次不会把分数弄低。' +
      '<span class="en">A retry keeps your best attempt, so trying again can never lower your score.</span></p>' +
    '<div class="row">' +
      '<button class="btn" id="nRetry" type="button">重做' + esc(LEVELS[w].n) + ' Retry</button>' +
      '<button class="btn ghost" id="nMenu" type="button">自由选关 Levels</button>' +
    '</div>',
    /* 人物摆在小路靠下的那一段。照 total/MAX 的真实比例摆的话，
       多数分数刚好落在文字框後面，等于没画。这一格是气氛，不是读数 ——
       差多少分，上面那行字已经写得清清楚楚。
       The character sits on the lower stretch of the trail. Placed at the true
       total/MAX fraction it lands behind the text panel for most scores, which
       is the same as not drawing it. This is atmosphere, not a readout: the gap
       is stated in words directly above. */
    /* 这一屏<b>不</b>推近山顶。推近了，山腰上的人物就被裁到画面外，
       只剩一面旗子 —— 而这一屏要说的正是「人在这里、旗子在那里」。
       整片山景摆着，两个都看得见，中间那段距离自己会说话。
       人物摆在文字框下方那一条看得见的带子里 —— 450px 的框，文字框几乎占满
       中间，再往上摆就又被盖住了。
       This screen does NOT push in on the summit. Zoomed in, the character on
       the lower slope falls outside the frame and only the flag remains — but
       the whole point here is "you are here, the flag is there". The full scene
       keeps both in view and the distance between them speaks for itself. */
    {avatar:S.av, avatarAt: .05 + .13 * Math.min(1, total()/PASS)});
  $('nRetry').addEventListener('click', ()=>{ S.lv = w; S.pi = 0; renderPanel(); });
  $('nMenu').addEventListener('click', scrMenuShow);
}

function scrTopShow(){
  /* 唯一的一道闸 —— 所有通往登顶画面的路都从这里过，
     漏掉任何一条，凭证就发给了不该拿到的人。
     The single gate: every route to the summit screen comes through here.
     Miss one and the certificate goes to someone who has not earned it. */
  if(!summited()) return scrNearShow();

  const now = new Date();
  const stampNow = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') +
    ':' + String(now.getMinutes()).padStart(2,'0');
  const when = S.doneAt || stampNow;

  paintScr('scrTop',
    '<h1 style="font-size:15px">🎉 登顶了！<span class="en" style="font-size:10.5px">' +
      'Screenshot this screen and submit it in SLS</span></h1>' +
    '<div class="cols">' +
      '<div class="pic"></div>' +
      '<div class="sheet">' +
        '<div class="who">' + esc(S.name) +
          (S.cls ? '<small>' + esc(S.cls) + '</small>' : '') + '</div>' +
        '<table>' +
          '<tr class="hd"><td>关卡</td><td class="v">分数</td><td class="v">用时</td></tr>' +
          LEVELS.map((L,i)=>
            '<tr><td>' + esc(L.n) + '</td>' +
            '<td class="v">' + lvScore(i) + '/' + lvMax(i) + '</td>' +
            '<td class="v">' + CLOCK.fmt(CLOCK.lap(i)) + '</td></tr>').join('') +
          '<tr class="tot"><td>总计 Total</td>' +
            '<td class="v">' + total() + '/' + MAX + '</td>' +
            '<td class="v">' + CLOCK.fmt(CLOCK.total()) + '</td></tr>' +
        '</table>' +
        '<div class="meta">' +
          '<div>完成 ' + when + '</div>' +
          '<div>单元五《学无止境》· 对比论证法</div>' +
          '<div>验证码 ' + verifyCode(when) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<p style="font-size:11px;max-width:640px">' +
      zh('《学然后知不足》先反后正，《终身学习》先正后反，两篇课文都用了') +
      '<b style="color:var(--gold)">' + zh('对比论证法') + '</b>。' +
      '<span class="en">Use your device\'s own screenshot function — do not look for a download button.</span></p>' +
    '<div class="row">' +
      '<button class="btn ghost" id="tBack" type="button">回选关 Levels</button></div>');
  fitScene($('scrTop').querySelector('.pic'), {avatar:S.av, zoom:.5});
  SFX.win();
  $('tBack').addEventListener('click', scrMenuShow);
}

/* 一个短短的验证码，由姓名、分数、用时、完成时刻算出来。
   不是防伪 —— 只是让「把截图里的分数改一改」这件事没那么无声无息：
   改了数字，验证码就对不上老师自己算出来的那一个。
   A short code derived from the name, marks, times and finish stamp. Not
   security — just enough that editing a number in the screenshot no longer
   goes unnoticed, since the code would stop matching. */
function verifyCode(when){
  const raw = [S.name, S.cls, S.marks.map(m=>m.join(',')).join(';'),
               CLOCK.total(), when].join('|');
  let h = 2166136261;
  for(let i=0;i<raw.length;i++){ h ^= raw.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(36).toUpperCase().padStart(7,'0').slice(-7);
}

/* ══════════════════════════════════════════════════════════════
   十、开场 ｜ 10. BOOT
   ══════════════════════════════════════════════════════════════ */

/* 拼音切换钮常驻顶栏，不藏在设定页里 ｜ the pinyin toggle stays visible, never buried in a settings page */
const pyBtn = $('pyBtn'), enBtn = $('enBtn');
function setPy(on){
  S.py = on; save();
  document.body.classList.toggle('py', on);
  pyBtn.setAttribute('aria-pressed', String(on));
  if(P) fitBand();      // 多了／少了拼音行，版面要重配 ｜ the ruby line changes the fit
}
function setEn(on){
  S.en = on; save();
  document.body.classList.toggle('noen', !on);
  enBtn.setAttribute('aria-pressed', String(on));
  if(P) fitBand();          // 少了英文那一行，版面会松出一点 ｜ the layout gains a line back
}
/* 拖到一半不给切换 —— 版面在手指底下变形，卡片就会掉错格子。
   这正是当初改用 visibility 想避开的情况，在这里挡掉更直接。
   Refuse to toggle mid-drag: reflowing the layout under a moving finger is how
   a card lands in the wrong slot. This is the case the old visibility trick was
   trying to avoid, blocked here at the source instead. */
pyBtn.addEventListener('click', ()=>{ if(!drag) setPy(!S.py); });
enBtn.addEventListener('click', ()=>{ if(!drag) setEn(!S.en); });

$('menuBtn').addEventListener('click', scrMenuShow);
$('sndBtn').addEventListener('click', ()=>SFX.toggle());
$('bgmBtn').addEventListener('click', ()=>BGM.toggle());

/* 浏览器不准网页自己出声，必须等使用者动一下手 —— 第一次点击就把音频叫醒
   Browsers won't let a page make sound unsound-prompted; the first tap wakes it */
function wakeAudioOnce(){
  SFX.wake();
  if(BGM.on && SFX.on) BGM.start();
  window.removeEventListener('pointerdown', wakeAudioOnce);
}
window.addEventListener('pointerdown', wakeAudioOnce);

/* ──────── 欢迎画面 ｜ the welcome screen ────────
   记分接不上时，从这里讲 —— 一行提示，按钮照样在，人照样进得去。
   之前的做法是拦一张红色警告画面，结果老师在 SLS 里预览（Module View
   本来就不带记分参数）一打开就吃到「分数无法记录」，像是坏了。
   Scoring problems are said here: one line, with the button still right there.
   The previous design put a red wall in front, so a teacher previewing in
   Module View — which never carries launch parameters — opened the activity
   and was told it was broken. */
function statusNote(){
  if(XAPI.inSLS) return '';                    // 接上了，什么都不必说 ｜ connected: say nothing
  if(!XAPI.everSLS) return '';                 // 网页版，本来就不记分 ｜ web build: never scored

  return XAPI.embedded
    ? '<div class="status"><span class="ic">ⓘ</span><span>' +
        '这个画面收不到 SLS 的记分参数，分数不会记录。老师在 Module View 预览时属正常现象。' +
        '<span class="en">No scoring parameters on this frame — normal in a teacher preview. ' +
        'Scores are recorded when a student opens the assigned activity.</span></span></div>'
    : '<div class="status"><span class="ic">⚠️</span><span>' +
        '你是在新分页里打开的，<b>分数不会记录</b>。想让分数算数，请回到 SLS 里作答。' +
        '<span class="en">Opened outside SLS, so the score will not be recorded. ' +
        'Answer inside SLS for it to count.</span></span></div>';
}

function scrWelcomeShow(){
  const resume = !!S.name;
  paintScr('scrWelcome',
    '<h1>⛰️ 中三G3华文单元五《学无止境》<br>书山登顶</h1>' +
    '<p class="sub">两篇课文，一篇先反后正，一篇先正后反。' +
      '爬完三关，你会看出它们其实在做同一件事。' +
      '<span class="en">Two texts, argued in opposite orders. Climb all three levels ' +
      'and you will see they are doing the same thing.</span></p>' +
    '<div class="lvchips">' + LEVELS.map((L,i)=>
      '<div class="lvchip"><b>' + esc(L.n) + '</b><span>' + esc(L.t.replace(/^[^《]*/, '')) +
      '</span><small>' + lvMax(i) + ' 分' +
      (lvDone(i) ? ' · ✅ ' + lvScore(i) : '') + '</small></div>').join('') +
    '</div>' +
    '<p class="sub" style="font-size:11px">共 ' + MAX + ' 分 · 拿到 <b style="color:var(--gold)">' +
      PASS + ' 分</b>就能登顶 · 三节课分次完成' +
      '<span class="en">' + MAX + ' marks · reach ' + PASS + ' to summit · across three lessons</span></p>' +
    statusNote() +
    '<div class="row"><button class="btn" id="wGo" type="button">' +
      (resume ? '继续 Continue' : '开始 Start') + '</button></div>' +
    '<div class="credit">郑凯欣老师 · 百德中学母语部主任<br>' +
      'Mdm Chun Kai Xin · HOD/MTL · Bukit View Secondary School</div>',
    {avatar: resume ? S.av : null, zoom:.62});
  $('wGo').addEventListener('click', ()=>{
    SFX.wake();
    if(BGM.on && SFX.on) BGM.start();
    resume ? scrMenuShow() : scrNameShow();
  });
}

/* 顶栏那个「预览 · 不记分」的小标。欢迎画面上那一行讲一次，
   进了游戏之后就靠这个小标常驻提醒 —— 免得老师预览到一半忘了这是预览。
   The top-bar chip. The welcome screen says it once; this keeps saying it
   quietly during play, so a teacher deep in a preview does not forget. */
function showNoScore(){
  const el = $('noscore');
  if(!el) return;
  el.hidden = false;
  el.title = '这个画面收不到 SLS 的记分参数' +
    (XAPI.missing && XAPI.missing.length ? '（缺：' + XAPI.missing.join('、') + '）' : '') +
    '。\n教师在 Module View 预览时属正常现象 —— 预览本来就不记分。' +
    '\n若学生作答时也看到这一行，请确认元件是以 Interactive Response 上传的。' +
    '\n\nNo xAPI launch parameters on this frame. Normal in a teacher preview; ' +
    'if students see it, check the component was uploaded as Interactive Response.';
}

function boot(){
  load();
  paintBand();
  scoreEl.textContent = total() + ' / ' + MAX;
  setPy(S.py);
  setEn(S.en);
  $('sndBtn').textContent = SFX.on ? '🔊' : '🔇';
  $('sndBtn').classList.toggle('off', !SFX.on);
  $('bgmBtn').classList.toggle('off', !BGM.on);
  CLOCK.paint();
  /* 不管记分接不接得上，一律从欢迎画面开始。
     记不了分是要讲的，但那是欢迎画面里的一行字，不是挡在前面的一堵墙。
     Always open on the welcome screen, whatever the scoring situation. A
     scoring problem is a line of text on that screen, never a wall in front. */
  if(!XAPI.init() && XAPI.everSLS) showNoScore();
  scrWelcomeShow();
}
boot();
