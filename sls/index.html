<!DOCTYPE html>
<!--
  ══════════════════════════════════════════════════════════════
  单元五《学无止境》· 三关合一 ｜ Unit 5, three levels in one file
  中三 G3 华文 · 对比论证法 ｜ S3 G3 Chinese Language · 对比论证法

  这是「SLS 版」：内嵌 xAPIWrapper，做完自动把分数送进教师后台。
  网页版在 game.html，内容一字不差，只少了记分程式码。
  This is the SLS build: xAPIWrapper embedded, scores land in the gradebook.
  The web build is game.html — identical content, minus the scoring code.

  单一自足档案：没有外部函式库、没有外部字体、没有外部图档。
  SLS 的 sandbox 会挡掉所有对外请求，所以什么都得待在这个档案里。
  Single self-contained file: no external libraries, fonts or images —
  the SLS sandbox blocks every outbound request, so everything lives inline.
  ══════════════════════════════════════════════════════════════
-->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中三G3华文单元五《学无止境》· 书山登顶 ｜ S3 G3 Chinese Unit 5</title>
<style>
/* ══════════════════════════════════════════════════════
   版面的第一原则：SLS 的 iframe 只有 450px 高。
   所有东西都必须塞进这个高度，而且不能靠上下滚动 ——
   学生拖曳途中版面一跳动，卡片就掉错格子。
   Layout rule #1: the SLS iframe is only 450px tall. Everything has to fit,
   and nothing may reflow mid-drag — a jump while dragging drops the card
   in the wrong slot.
   ══════════════════════════════════════════════════════ */
:root{
  --navy:#062033;
  --panel:rgba(9,52,84,.94);
  --gold:#FFC72C;        /* 校色黄 school yellow */
  --green:#3fae63;       /* 校色绿 school green */
  --blue:#2f8fd0;
  --ink:#fff;
  --dim:rgba(255,255,255,.62);
  --bad:#ff8f8f;
  --slot:rgba(255,255,255,.09);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--navy);color:var(--ink);overflow:hidden;
  font-family:'PingFang SC','Microsoft YaHei','Heiti SC','SimHei',sans-serif;
  font-size:13px;line-height:1.6;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}

/* 舞台：固定 450px 高，宽度铺满 ｜ the stage: locked to 450px, full width */
#stage{position:relative;width:100%;height:100%;min-height:420px;max-height:100vh;overflow:hidden;
  display:flex;flex-direction:column}

/* ════════ 双语：英文只用于系统与导航文字 ════════
   学习内容一律只用华文 —— 题目附英译等于直接给答案。
   Bilingual chrome only. Question content stays Chinese-only: an English
   gloss on the content would hand over the answer. */
.en{display:block;font-size:.82em;color:var(--dim);font-weight:400;letter-spacing:.1px}
/* 关掉英文只是把系统与导航的英文收起来 —— 题目本来就只有华文，不受影响。
   Turning English off only hides the chrome and navigation strings; the
   question content was Chinese-only to begin with, so nothing there changes. */
body.noen .en{display:none}

/* ════════ 顶栏 ｜ top bar ════════ */
#top{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:5px 10px;
  background:rgba(4,20,34,.9);border-bottom:1px solid rgba(255,199,44,.28);
}
#top .lv{font-weight:900;color:var(--gold);font-size:12.5px;white-space:nowrap}
#top .prog{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
/* 「不记分」小标：嵌在 SLS 里、但拿不到记分参数时出现（多半是老师在 Module View 预览）。
   这种情况不该弹红色警告 —— 预览本来就不该记分。但也不能默不作声：
   万一学生作答时看到它，那就是真的出事了，老师得看得见。
   The not-scored chip appears when we are embedded in SLS but have no scoring
   parameters — normally a teacher previewing in Module View. That case does not
   deserve a red alarm, since a preview is not meant to score. It does deserve to
   be visible: if a student ever sees this, something is genuinely wrong. */
#noscore{font-size:10.5px;white-space:nowrap;color:#ffd98a;
  background:rgba(255,199,44,.16);border:1px solid rgba(255,199,44,.4);
  border-radius:7px;padding:3px 7px;cursor:help;line-height:1.3}
#noscore .en{display:inline;font-size:9.5px;color:rgba(255,217,138,.75);margin-left:3px}
#noscore .zh-only{display:inline}
body.noen #noscore .zh-only{display:inline}
@media(max-width:620px){#noscore .en{display:none}}
.ibtn{font:inherit;font-size:13px;line-height:1;background:rgba(14,80,132,.85);color:#fff;
  border:1px solid rgba(255,199,44,.4);border-radius:7px;padding:4px 7px;cursor:pointer}
.ibtn.off{opacity:.38}
@media(max-width:620px){#top .prog{display:none}.tbtn{padding:4px 6px;font-size:10.5px}}
#top .sp{flex:1}
.tbtn{
  font:inherit;font-size:11px;font-weight:700;background:rgba(14,80,132,.85);color:#fff;
  border:1px solid rgba(255,199,44,.4);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap;
}
.tbtn:hover{background:rgba(20,104,168,.95)}
.tbtn[aria-pressed="true"]{background:var(--gold);color:#3a2600;border-color:var(--gold)}
#score{font-weight:900;color:var(--green);font-size:12.5px;white-space:nowrap}

/* ════════ 登山带 ｜ the climbing strip ════════
   完整的山景留给选关画面与登顶画面；关卡里只留这条 52px 的带子，
   把垂直空间让给卡片。人物随进度往山顶走。
   The full mountain is saved for the menu and summit screens. Inside a level
   only this 52px strip remains, so the cards get the vertical space. The
   character walks toward the peak as panels are completed. */
/* 山景占画面上半 —— 学生一眼看得到自己爬到哪里，也让 450px 的框不那么闷
   The scenery takes the top half: the climb is the whole point, and it stops
   a 450px frame from feeling like a spreadsheet. */
#climb{flex:0 0 auto;position:relative;height:42%;overflow:hidden;
  border-bottom:1px solid rgba(255,199,44,.3)}

/* 云慢慢飘，太阳的光晕轻轻呼吸 —— 静止的风景太像一张贴图
   Clouds drift and the sun's halo breathes: a frozen landscape reads as
   wallpaper. Four cloud speeds so they never line up and march in step. */
.cloud{animation:drift 34s ease-in-out infinite alternate}
.cloud.c1{animation-duration:46s;animation-delay:-8s}
.cloud.c2{animation-duration:27s;animation-delay:-14s}
.cloud.c3{animation-duration:52s;animation-delay:-3s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.sun{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
/* 学生若在系统里关掉了动画效果，就别再动 ｜ respect a reduced-motion preference */
@media(prefers-reduced-motion:reduce){.cloud,.sun{animation:none}}
#climb svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ════════ 场地 ｜ the playfield ════════ */
#field{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;
  gap:4px;padding:5px 10px 2px;min-height:0}
/* 课本出处 —— 这一班找不到「现在该翻到哪一页」就会卡住，
   所以每个版面都把课文与段落写在画面上，而不是让他们回头猜。
   Where to look in the textbook. This class stalls when it cannot tell which
   page it is meant to be on, so every panel names the text and the paragraph
   on screen rather than leaving it to be guessed. */
#src{flex:0 0 auto;text-align:center;font-size:10.5px;line-height:1.35;
  color:#ffd98a;background:rgba(255,199,44,.12);border:1px solid rgba(255,199,44,.28);
  border-radius:8px;padding:3px 9px;align-self:center;max-width:100%}
#src b{color:var(--gold);font-weight:800}
#src .en{display:inline;font-size:9.5px;color:rgba(255,217,138,.62);margin-right:5px}
#src:empty{display:none}

#tip{flex:0 0 auto;font-size:11px;color:var(--dim);text-align:center;line-height:1.4}
#tip b{color:var(--gold);font-weight:700}
#tip .en{font-size:10px;color:rgba(255,255,255,.44)}

/* 卡片池 ｜ the pool of draggable cards */
#pool{flex:0 1 auto;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;
  padding:5px;border-radius:9px;background:rgba(255,255,255,.05);
  border:1px dashed rgba(255,255,255,.16);min-height:36px;overflow-y:auto}
#pool.empty{display:none}

/* 格子区 ｜ the slots */
#slots{flex:1 1 auto;display:grid;gap:5px;overflow-y:auto;min-height:0;
  align-content:stretch;grid-auto-rows:minmax(44px,1fr);scrollbar-width:thin;
  scrollbar-color:rgba(255,199,44,.35) transparent}
#slots::-webkit-scrollbar,#pool::-webkit-scrollbar{width:5px}
#slots::-webkit-scrollbar-thumb,#pool::-webkit-scrollbar-thumb{
  background:rgba(255,199,44,.35);border-radius:3px}
#slots::-webkit-scrollbar-track,#pool::-webkit-scrollbar-track{background:transparent}
.slot{
  background:var(--slot);border:1.5px dashed rgba(255,255,255,.24);border-radius:9px;
  padding:4px;display:flex;flex-direction:column;gap:3px;min-height:44px;
  transition:background .12s,border-color .12s;
}
.slot .hd{font-size:10.5px;font-weight:800;color:var(--gold);text-align:center;line-height:1.3;padding:0 2px}
.slot .hd small{display:block;font-size:9px;font-weight:400;color:var(--dim)}
.slot.hot{background:rgba(255,199,44,.22);border-color:var(--gold);border-style:solid}
.slot.full{border-style:solid;border-color:rgba(63,174,99,.5)}
.slot .drop{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;justify-content:center;
  align-items:center;min-height:0}
.slot .drop.row{flex-direction:row;flex-wrap:wrap;align-content:center}
.slot .drop.row > .card{flex:1 1 0;min-width:0}
.slot .drop > .card{width:100%}

/* 卡片 ｜ the cards */
.card{
  background:linear-gradient(#0e5084,#0a3a5c);border:1.5px solid rgba(255,199,44,.55);
  border-radius:8px;padding:5px 8px;font-size:11.5px;line-height:1.5;color:#fff;
  cursor:grab;max-width:100%;text-align:center;overflow-wrap:anywhere;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s;
}
.card:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.card.sel{background:linear-gradient(#1a74bb,#0e5084);border-color:var(--gold);
  box-shadow:0 0 0 2px var(--gold),0 3px 10px rgba(0,0,0,.45)}
.card.placed{cursor:default;background:linear-gradient(#0d5a3a,#0a4530);border-color:rgba(63,174,99,.7)}
.card.placed:hover{transform:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.card.bad{animation:nope .34s}
@keyframes nope{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}
.card.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.94;cursor:grabbing;
  box-shadow:0 8px 22px rgba(0,0,0,.55);transform:scale(1.04)}
.card .mk{font-weight:900;margin-right:3px}
.card.ok .mk{color:#7ff0a8}
.card.no .mk{color:var(--bad)}

/* 选择题与多选题 ｜ single- and multi-select questions */
.qbox{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:1px 0;
  overflow-y:auto}
.qstem{font-size:12px;font-weight:700;text-align:center;line-height:1.5;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:5px;align-items:center}
.opt{
  width:100%;max-width:560px;font:inherit;font-size:11.5px;line-height:1.5;text-align:left;
  background:rgba(14,80,132,.8);border:1.5px solid rgba(255,199,44,.4);border-radius:9px;
  padding:6px 10px;color:#fff;cursor:pointer;display:flex;align-items:flex-start;gap:8px;
  overflow-wrap:anywhere;
}
.opt .box{margin-top:1px}
.opt:hover{background:rgba(20,104,168,.95)}
.opt .box{flex:0 0 auto;width:15px;height:15px;border:1.5px solid rgba(255,255,255,.6);border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.opt.on{background:rgba(255,199,44,.2);border-color:var(--gold)}
.opt.on .box{background:var(--gold);color:#3a2600;border-color:var(--gold)}
.opt.right{background:rgba(63,174,99,.24);border-color:var(--green)}
.opt.wrong{background:rgba(255,110,110,.18);border-color:var(--bad)}

/* ════════ 底栏 ｜ action bar ════════ */
#bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:4px 10px;
  background:rgba(4,20,34,.9);border-top:1px solid rgba(255,199,44,.22);min-height:38px}
#fb{flex:1 1 auto;font-size:11.5px;line-height:1.45;color:var(--dim)}
#fb.good{color:#8ff0b4}
#fb.bad{color:var(--bad)}
.btn{
  font:inherit;font-size:12.5px;font-weight:800;border:none;border-radius:9px;padding:8px 16px;
  background:linear-gradient(#FFD35C,#E8A81E);color:#3a2600;cursor:pointer;white-space:nowrap;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:rgba(14,80,132,.85);color:#fff;border:1px solid rgba(255,199,44,.4)}

/* ════════ 拼音 ｜ pinyin ════════
   一律人工撰写，存在 RUBY 字典里。不用转换函式库：官方禁用外部函式库，
   而且自动转换必错在多音字上 —— 好学 hào 不是 hǎo，乐在其中 lè 不是 yuè，
   逆水行舟 xíng 不是 háng。在华文课上把拼音标错，比不标更糟。
   Written by hand, stored in the RUBY dictionary. No conversion library:
   external libraries are barred, and auto-conversion always trips on
   heteronyms. A wrong pinyin in a Chinese lesson is worse than none.

   关掉拼音时用 display:none，让 <rt> 完全不占位置。
   本来用的是 visibility:hidden —— 想法是让拼音行一直占着位子，按切换钮时
   版面才不会跳。但 <rt> 隐形却仍然占宽度：「yìng」比「应」宽，
   于是关着拼音的时候，「手机应用」中间硬生生裂开一道缝，
   「策划义工活动」也是。而关着拼音才是预设状态 —— 为了防一个偶发的跳动，
   把常态的中文弄成断字，这笔帐算反了。
   版面跳动改用别的办法防：切换后重新配一次版（fitBand），
   而且拖曳途中直接不让切换 —— 那才是当初真正担心的情况。
   Turning pinyin off now removes <rt> entirely. It used to be hidden with
   visibility, the idea being that the ruby line should always hold its space so
   the layout never jumps on toggle. But an invisible <rt> still occupies WIDTH:
   'yìng' is wider than 应, so with pinyin off a visible gap tore 手机应用 apart,
   and 策划义工活动 with it. Pinyin off is the default state — breaking ordinary
   Chinese apart in the common case to prevent an occasional reflow in the rare
   one is the wrong trade. The reflow is handled where it actually matters
   instead: re-fit after toggling, and refuse to toggle mid-drag. */
ruby{ruby-align:center}
rt{
  font-size:.62em;font-weight:400;color:var(--gold);letter-spacing:0;
  line-height:1.1;
}
body:not(.py) rt{display:none}

/* ════════ 覆盖画面 ｜ overlay screens ════════ */
/* 覆盖画面：山景整片亮着，文字另外放进一个框里。
   以前是整幅画面压暗再放字 —— 字是看清了，风景也一起没了。
   Overlay screens keep the scenery at full brightness and put the text in its
   own panel. Dimming the whole picture to make text legible costs the view. */
.scr{
  position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;padding:12px 14px;text-align:center;
  background:#0b3a63;overflow:hidden;
}
.scr.on{display:flex}
.scr .box{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;
  max-width:min(96%,720px);max-height:100%;overflow-y:auto;
  background:rgba(4,22,38,.84);border:2px solid rgba(255,199,44,.5);border-radius:16px;
  padding:14px 20px;box-shadow:0 10px 34px rgba(0,0,0,.42);
  scrollbar-width:thin;scrollbar-color:rgba(255,199,44,.35) transparent;
}
.scr.summit .box{background:rgba(4,22,38,.88);padding:10px 16px;gap:6px}
/* 「还差一点」的框收窄，左下角的人物与右上角的旗子才看得见 ——
   一个在山腰、一个在山顶，那段距离就是这一屏要说的话。
   A narrower panel on the short-of-summit screen, so the character at the lower
   left and the flag at the upper right both stay visible. The distance between
   them is what the screen is saying. */
#scrNear .box{max-width:min(94%,620px)}
.scr h1{font-size:17px;font-weight:900;color:var(--gold);line-height:1.45}
.scr h2{font-size:14px;font-weight:800;color:#fff;line-height:1.5}
.scr p{font-size:12px;color:var(--dim);line-height:1.7;max-width:640px}
.scr p.en{font-size:11px;color:rgba(255,255,255,.44)}
.scr .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center}

/* 山景铺满整个画面 ｜ the scenery fills the screen behind the panel */
.scene{position:absolute;inset:0;z-index:0}
.scene svg{display:block;width:100%;height:100%}

/* 欢迎画面 —— 任何人打开这个游戏，第一眼看到的就是这里。
   这个组件会上架 SLS 社群资源库给别的老师用，所以第一眼不能是一张错误讯息：
   记分接不上是要讲，但讲法是画面里一行淡淡的提示，不是拦路的红色警告。
   The welcome screen is the first thing anyone sees. This component goes into
   the SLS Community Gallery for other teachers, so the first frame must not be
   an error. A scoring problem still gets said — as a quiet line inside the
   screen, not a red wall in front of it. */
.welcome h1{font-size:clamp(15px,2.6vw,20px);line-height:1.4}
.welcome .sub{font-size:12px;color:rgba(255,255,255,.8);line-height:1.65;max-width:560px}
.lvchips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.lvchip{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,199,44,.32);border-radius:10px;
  padding:6px 11px;min-width:118px;
}
.lvchip b{display:block;font-size:10px;color:var(--gold);letter-spacing:.4px}
.lvchip span{display:block;font-size:11px;color:#fff;font-weight:700;margin:2px 0 1px;line-height:1.35}
.lvchip small{display:block;font-size:10px;color:var(--dim)}
/* 最弱的一关标出来 —— 学生盯着看的就是这一格 ｜ the level to go back to */
.lvchip.weak{border-color:#ff9b9b;background:rgba(255,140,140,.16)}
.lvchip.weak b{color:#ffb3b3}
.lvchip.weak small{color:#ffb3b3;font-weight:700}
.credit{font-size:10px;color:rgba(255,255,255,.42);line-height:1.6}

/* 记分状态：一行淡淡的提示，不拦路 ｜ scoring status: a quiet line, never a blocker */
.status{
  display:flex;align-items:flex-start;gap:7px;text-align:left;max-width:580px;
  background:rgba(255,199,44,.1);border:1px solid rgba(255,199,44,.3);border-radius:10px;
  padding:8px 12px;font-size:11px;line-height:1.6;color:rgba(255,255,255,.8);
}
.status .ic{flex:0 0 auto;font-size:13px;line-height:1.3}
.status .en{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}

/* 开场的两条规矩 ｜ the two house rules on the opening screen */
.rules{text-align:left;background:rgba(255,199,44,.1);border:1px solid rgba(255,199,44,.32);
  border-radius:10px;padding:9px 13px;max-width:600px}
.rules p{font-size:11.5px;line-height:1.65;color:rgba(255,255,255,.82);margin:3px 0}
.rules p b{color:var(--gold)}
.rules .en{font-size:10px;margin-top:1px}

/* 输入 ｜ name and class inputs */
.field{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.field label{font-size:10.5px;color:var(--dim);font-weight:700}
.field input{
  font:inherit;font-size:13px;background:rgba(255,255,255,.1);color:#fff;
  border:1.5px solid rgba(255,199,44,.45);border-radius:8px;padding:7px 10px;width:170px;
  -webkit-user-select:text;user-select:text;
}
.field input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.16)}

/* 头像选择 ｜ avatar picker */
.avs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.av{
  width:70px;height:96px;border:2px solid rgba(255,255,255,.22);border-radius:11px;
  background:rgba(255,255,255,.07);cursor:pointer;padding:0;position:relative;overflow:hidden;
}
.av i{position:absolute;left:50%;bottom:14px;width:56px;height:70px;transform:translateX(-50%);
  image-rendering:pixelated;display:block}
.av u{position:absolute;left:0;right:0;bottom:2px;font-size:9.5px;font-style:normal;
  text-decoration:none;color:var(--dim);line-height:1.2}
.av.on u{color:var(--gold);font-weight:700}
.av.on{border-color:var(--gold);background:rgba(255,199,44,.2);box-shadow:0 0 0 2px rgba(255,199,44,.35)}

/* 选关 ｜ level select */
.lvs{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.lvc{
  width:170px;background:var(--panel);border:2px solid rgba(255,199,44,.5);border-radius:12px;
  padding:11px 10px;cursor:pointer;text-align:center;font:inherit;color:#fff;
  transition:transform .12s,background .12s;
}
.lvc:hover{transform:translateY(-2px);background:rgba(14,80,132,.96)}
.lvc .n{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.5px}
.lvc .t{font-size:12.5px;font-weight:900;margin:3px 0 4px;line-height:1.4}
.lvc .s{font-size:11px;color:var(--dim)}
.lvc .s b{color:var(--green);font-weight:900}
.lvc.done{border-color:var(--green)}

/* 登顶画面：左边山景，右边成绩单 —— 一张截图就交代得完，不必滚动
   Summit: scenery left, scoreboard right — one screenshot captures the lot */
.summit .cols{display:flex;gap:13px;align-items:stretch;justify-content:center;
  width:100%;max-width:740px}
.summit .pic{flex:1 1 44%;min-width:0;border-radius:12px;overflow:hidden;
  border:2px solid rgba(255,199,44,.5);background:#08294a;min-height:172px}
.summit .pic svg{display:block;width:100%;height:100%}
.summit .sheet{flex:1 1 56%;min-width:0;text-align:left;display:flex;flex-direction:column;
  justify-content:center}
@media(max-width:600px){
  .summit .cols{flex-direction:column;gap:8px;max-width:340px}
  .summit .pic{min-height:96px;flex:0 0 auto}
}

/* 登顶成绩 ｜ the summit scoreboard */
.sheet{
  background:rgba(4,20,34,.86);border:2px solid var(--gold);border-radius:13px;
  padding:11px 18px;display:inline-block;min-width:250px;
}
.sheet .who{font-size:14px;font-weight:900;color:#fff;line-height:1.5}
.sheet .who small{display:block;font-size:10.5px;color:var(--dim);font-weight:400;margin-top:2px}
.sheet table{width:100%;border-collapse:collapse;margin-top:6px}
.sheet td{font-size:11.5px;padding:2px 0;color:var(--dim);text-align:left;white-space:nowrap}
.sheet td.v{text-align:right;color:#fff;font-weight:700;
  font-variant-numeric:tabular-nums;padding-left:10px}
.sheet tr.hd td{font-size:9.5px;color:rgba(255,255,255,.4);font-weight:700;
  border-bottom:1px solid rgba(255,255,255,.14);padding-bottom:3px}
.sheet tr.hd td.v{color:rgba(255,255,255,.4);font-weight:700}
.sheet tr.tot td{border-top:1px solid rgba(255,199,44,.35);padding-top:4px;font-size:12.5px;
  color:var(--gold);font-weight:900}
.sheet tr.tot td.v{color:var(--gold)}
.sheet .meta{margin-top:7px;padding-top:5px;border-top:1px solid rgba(255,255,255,.1);
  font-size:9.5px;line-height:1.7;color:rgba(255,255,255,.46)}

/* 警告（只在 SLS 版出现）｜ the new-tab warning (SLS build only) */
.warn{background:rgba(255,110,110,.14);border:1.5px solid rgba(255,140,140,.55);border-radius:11px;
  padding:12px 15px;max-width:560px}
.warn h2{color:#ffb3b3}

/* 矮画面（旧 iPad 横放、投影切窗）：山景让一点位置出来 ｜ short screens: the scene yields a little */
@media(max-height:430px){
  #climb{height:clamp(104px,34%,150px)}
  .card{font-size:11px;padding:4px 7px}
  #tip .en{display:none}
}

<script>

/* ══════════════════════════════════════════════════════════════
   一、拼音字典 ｜ 1. THE PINYIN DICTIONARY
   方案甲：只标课本已注音的词语，与课本保持一致，撰写量也可控。
   （方案乙＝全文逐字注音，450px 画面内视觉负担太重，未采用。）
   Plan A: annotate only the words the textbook itself annotates — consistent
   with the book and a manageable amount of hand-writing. (Plan B, annotating
   every character, was too visually heavy for a 450px frame.)

   要改：在这里加一行就好，全游戏的卡片、题干、格子标题都会自动跟着标。
   To change: add one line here; every card, stem and slot header follows.
   ══════════════════════════════════════════════════════════════ */
/* ▼▼▼ PINYIN-START ▼▼▼  tools/build-pinyin.py 会把这一段抽出去给网页用
   Extracted by tools/build-pinyin.py for the website — edit here only. */
const RUBY = {
  /* —— 课本注音词语 ｜ words annotated in the textbook —— */
  '雄鹰':'xióng yīng','渺小':'miǎo xiǎo','寓言':'yù yán','奥妙':'ào miào',
  '浅尝辄止':'qiǎn cháng zhé zhǐ','哲学':'zhé xué','比喻':'bǐ yù','热忱':'rè chén',
  '持之以恒':'chí zhī yǐ héng','清澈':'qīng chè','干涸':'gān hé','浇灌':'jiāo guàn',
  '楷模':'kǎi mó','孜孜不倦':'zī zī bù juàn','敷衍':'fū yǎn','淘汰':'táo tài',
  '佐证':'zuǒ zhèng','平庸':'píng yōng','阶段':'jiē duàn','同侪':'tóng chái',
  '撰写':'zhuàn xiě','筹备':'chóu bèi','募捐':'mù juān','实践':'shí jiàn',
  '震撼':'zhèn hàn','循规蹈矩':'xún guī dǎo jǔ','融会贯通':'róng huì guàn tōng',
  '腼腆':'miǎn tiǎn','咨询':'zī xún','分析':'fēn xī','桨':'jiǎng','岂':'qǐ',

  /* —— 多音字：自动转换一定错在这几个上 ｜ heteronyms: where auto-conversion always fails —— */
  '好学':'hào xué',                 /* 不是 hǎo ｜ not hǎo */
  '乐在其中':'lè zài qí zhōng',      /* 不是 yuè ｜ not yuè */
  '逆水行舟':'nì shuǐ xíng zhōu',    /* 不是 háng ｜ not háng */
  '虚心请教':'xū xīn qǐng jiào',     /* 不是 jiāo ｜ not jiāo */
  '应用':'yìng yòng',                /* 不是 yīng ｜ not yīng */
  '差不多':'chà bu duō',             /* 不是 chā ｜ not chā */
  '兴趣':'xìng qù',                  /* 不是 xīng ｜ not xīng */

  /* —— 人名与专名 ｜ names —— */
  '芝诺':'zhī nuò','朱熹':'zhū xī','鲁迅':'lǔ xùn','笛卡尔':'dí kǎ ěr',
  '方仲永':'fāng zhòng yǒng','李光耀':'lǐ guāng yào','楚国':'chǔ guó',

  /* —— 本单元反复出现的语文术语与成语 ｜ recurring terms and idioms —— */
  '反问句':'fǎn wèn jù','排比':'pái bǐ','论证':'lùn zhèng','引论':'yǐn lùn',
  '本论':'běn lùn','结论':'jié lùn','论点':'lùn diǎn','手足无措':'shǒu zú wú cuò',
  '骄傲自满':'jiāo ào zì mǎn','死记硬背':'sǐ jì yìng bèi','纸上谈兵':'zhǐ shàng tán bīng',
  '天资聪颖':'tiān zī cōng yǐng','赞叹':'zàn tàn','夸耀':'kuā yào','软技能':'ruǎn jì néng',
  '实习':'shí xí','义工':'yì gōng','策划':'cè huà','讲座':'jiǎng zuò','精明':'jīng míng',
  '增广见闻':'zēng guǎng jiàn wén','律师':'lǜ shī','总理':'zǒng lǐ','刻苦攻读':'kè kǔ gōng dú'
};
/* 长词优先，免得「好学」被「学」之类的短词抢先切开
   Longest-first, so 好学 isn't broken apart by a shorter key */
const RUBY_RE = new RegExp(Object.keys(RUBY).sort((a,b)=>b.length-a.length).join('|'),'g');

/* 把词语包成 <ruby>，一个汉字配一个音节 ｜ wrap a word as <ruby>, one syllable per character */
function zh(s){
  return String(s).replace(RUBY_RE, function(w){
    const py = RUBY[w].split(' ');
    if(py.length !== w.length) return w;        // 音节数对不上就不标 ｜ mismatch: leave it alone
    let out = '<ruby>';
    for(let i=0;i<w.length;i++) out += w[i] + '<rt>' + py[i] + '</rt>';
    return out + '</ruby>';
  });
}

/* ══════════════════════════════════════════════════════════════
   三、记分接口 ｜ 3. THE SCORING HOOK
   ▼▼▼ SLS-HOOK-START ▼▼▼   本档由 tools/build-sls.py 生成，请勿手改
   Generated by tools/build-sls.py — edit game.html instead, then rebuild.

   分数为什么曾经记录不到 SLS：
   SLS 的 xAPI 初始化，是从网址查询字符串读 endpoint / auth / agent / stateId /
   activityId。学生若另开分页，这些参数全部丢失，JSON.parse(agent) 抛出错误，
   而官方范例的 sendScore() 只在 catch 里 console.error —— 于是完全静默失败：
   游戏照常运作，学生做完，分数从未送出。
   Why scores silently failed before: SLS passes the launch parameters in the
   query string. Open the activity in a new tab and they are gone, JSON.parse
   throws, and the official sample only console.errors in its catch — so the
   game plays, the student finishes, and nothing is ever sent.

   对策：init() 回传成功与否，并且<b>记下缺了哪几个参数</b>。
   少了哪一个会写进顶栏那个小标的 tooltip，也印在 console 里 ——
   下次再出问题，不必猜。
   Fix: init() reports success and records WHICH parameters were missing. That
   list goes into the top-bar chip's tooltip and the console, so the next time
   something is wrong there is nothing to guess at.
   ══════════════════════════════════════════════════════════════ */
const XAPI = {
  p:null, inSLS:false, missing:[],
  /* 这一版是给 SLS 用的，所以「记不了分」确实是件该讲的事
     This build is for SLS, so a scoring failure genuinely is worth mentioning */
  everSLS:true,
  /* 页面是不是被嵌在框里。SLS 一定是嵌着跑的 ——
     所以「嵌着但没参数」跟「根本没嵌」是两回事，不能都当成另开分页。
     Whether we are inside a frame. SLS always embeds, so "framed but without
     parameters" and "not framed at all" are different situations and must not
     both be treated as a rogue new tab. */
  embedded:(function(){ try{ return window.self !== window.top; }catch(e){ return true; } })(),

  init(){
    const q = new URLSearchParams(location.search);
    const need = ['endpoint','auth','agent','stateId','activityId'];
    this.missing = need.filter(k => !q.get(k));
    if(this.missing.length){
      console.warn('[xAPI] 没有记分参数 ｜ no launch parameters. 缺 ｜ missing:',
                   this.missing.join(', '), '| embedded:', this.embedded);
      return false;
    }
    try{
      const agent = JSON.parse(q.get('agent'));
      if(!agent) throw new Error('agent parsed to null');
      ADL.XAPIWrapper.changeConfig({
        endpoint: q.get('endpoint') + '/',
        auth: 'Basic ' + q.get('auth')
      });
      this.p = {agent:agent, stateId:q.get('stateId'), activityId:q.get('activityId')};
      this.inSLS = true;
      console.log('[xAPI] 已连上 SLS ｜ connected, scores will be recorded');
      return true;
    }catch(e){
      this.missing = ['agent 解析失败 ｜ agent could not be parsed'];
      console.warn('[xAPI] init failed:', e);
      return false;
    }
  },

  /* 送出的必须是三关的<累计总分>，不能是单次得分。
     SLS 收的是 state 文件，后写覆盖前写 —— 若只送单关分数，
     学生日后补做第三关，就会把前两关的分数一起覆盖掉。
     Always send the RUNNING TOTAL. SLS stores this as a state document and a
     later write replaces the earlier one, so sending one level's score would
     wipe the others when a student returns days later to finish. */
  sendScore(score, max){
    try{
      if(!this.p) return;
      ADL.XAPIWrapper.sendState(this.p.activityId, this.p.agent, this.p.stateId, null,
        {score:score, maxScore:max, completed:true});
      console.log('[xAPI] 已送出 ｜ sent:', score + '/' + max);
    }catch(e){ console.warn('[xAPI] sendScore failed:', e); }
  }
};

/* ══════════════════════════════════════════════════════════════
   四、状态 ｜ 4. STATE
   姓名只存在这台装置的 localStorage 里，不随分数传送，不上传伺服器。
   老师要看到姓名，只有一条路：学生自己截图，用本人的 SLS 账号交上来。
   The name lives only in this device's localStorage. It is never sent with
   the score and never uploaded. The only way a teacher sees it is the student
   screenshotting the summit screen and submitting it from their own account.

   单一组件跨三节课使用，所以进度必须记住，并且可以自由选关。
   One component spans three lessons, so progress persists and any level can
   be entered in any order.
   ══════════════════════════════════════════════════════════════ */
const KEY = 'u5xwzj';
/* 跟落地页共用的两个键 —— 学生在哪一边改，另一边都算数
   Shared with the landing page, so a change on either side counts on both */
const LANG_KEY = 'u5_lang', PY_KEY = 'u5_pinyin';
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const S = {
  name:'', cls:'', av:0, py:false, en:true, laps:[0,0,0], doneAt:'',
  marks:[[],[],[]],     // marks[lv][panel] = 该版面得分 ｜ marks earned on that panel
  lv:0, pi:0
};

function load(){
  /* 网站那两个键优先 —— 学生刚在落地页设过，进来就该是那个设定
     The shared keys win: whatever the student just set on the landing page is
     what they should find when the game opens. */
  const sharedPy = ls.get(PY_KEY), sharedLang = ls.get(LANG_KEY);
  if(sharedPy != null) S.py = sharedPy === '1';
  if(sharedLang != null) S.en = sharedLang !== 'zh';
  try{
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    if(o && typeof o === 'object'){
      S.name = o.name || ''; S.cls = o.cls || '';
      S.av = o.av|0; S.doneAt = o.doneAt || '';   // py/en 交给下面的共用键处理 ｜ py/en handled by the shared keys below
      if(Array.isArray(o.laps) && o.laps.length === 3) S.laps = o.laps.map(v=>v|0);
      if(o.snd != null) SFX.on = !!o.snd;
      if(o.bgm != null) BGM.on = !!o.bgm;
      if(sharedPy == null && o.py != null) S.py = !!o.py;
      if(sharedLang == null && o.en != null) S.en = !!o.en;
      if(Array.isArray(o.marks) && o.marks.length === 3) S.marks = o.marks;
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(
    {name:S.name, cls:S.cls, av:S.av, py:S.py, en:S.en, laps:S.laps, doneAt:S.doneAt,
     marks:S.marks, snd:SFX.on, bgm:BGM.on})); }catch(e){}
  ls.set(PY_KEY, S.py ? '1' : '0');
  ls.set(LANG_KEY, S.en ? 'both' : 'zh');
}

const lvScore = i => (S.marks[i]||[]).reduce((a,b)=>a+(b|0),0);
const total   = () => LEVELS.reduce((a,_,i)=>a+lvScore(i),0);
const lvDone  = i => (S.marks[i]||[]).filter(v=>v!=null).length === LEVELS[i].panels.length;
/* 版面满分＝可放的卡片数；多选与选择题各 1 分
   A panel's max = the number of placeable cards; multi/choice are worth 1 */
const panelMax = p => p.k==='slots' ? p.cards.filter(c=>c.s>=0).length : 1;
/* 每关满分与全场满分都是算出来的，题库是唯一的真本
   Both a level's maximum and the grand total are computed; the bank is the
   single source of truth */
const lvMax = i => LEVELS[i].panels.reduce((a,p)=>a+panelMax(p), 0);
const MAX   = LEVELS.reduce((a,_,i)=>a+lvMax(i), 0);

/* 登顶门槛：满分的 65%，往上取整。36 分 → 24 分（66.7%）。
   宁可多算一分，也不要让「65%」这个说法名不副实。
   一样是算出来的 —— 日后加题删题，门槛自己跟着走。
   The summit threshold: 65% of the maximum, rounded up. 36 marks -> 24 (66.7%).
   Rounding up rather than down keeps the claim "65%" honest. Computed like
   everything else, so adding or removing questions moves it automatically. */
const PASS = Math.ceil(MAX * 0.65);
const summited = () => total() >= PASS;

/* 最弱的一关，按百分比算 —— 各关满分不同，比绝对分数公平
   The weakest level by percentage: the levels have different maximums, so a
   raw score comparison would point at the wrong one */
function weakestLevel(){
  let best = 0, bestPct = 2;
  LEVELS.forEach((_, i)=>{
    const pct = lvScore(i) / Math.max(1, lvMax(i));
    if(pct < bestPct){ bestPct = pct; best = i; }
  });
  return best;
}

/* ══════════════════════════════════════════════════════════════
   五、山景 ｜ 5. THE MOUNTAIN
   山脊只写一次，登山带与整幅山景共用同一组座标 ——
   人物才会真的踩在山脊线上，而不是浮在半空。
   The ridge is defined once and shared by the climbing strip and the full
   scene, so the character actually stands ON the ridge line rather than
   floating somewhere near it.
   ══════════════════════════════════════════════════════════════ */
const RIDGE = [[0,46],[52,40],[104,43],[158,32],[214,35],[268,22],[318,25],[364,10],[400,4]];

function ridgeY(x){                       // 线性内插 ｜ linear interpolation along the ridge
  for(let i=1;i<RIDGE.length;i++){
    if(x <= RIDGE[i][0]){
      const [x0,y0] = RIDGE[i-1], [x1,y1] = RIDGE[i];
      return y0 + (y1-y0) * (x-x0) / (x1-x0 || 1);
    }
  }
  return RIDGE[RIDGE.length-1][1];
}
const ridgePath = () =>
  'M0,52 L' + RIDGE.map(p=>p[0]+','+p[1]).join(' L') + ' L400,52 Z';

/* ══════════════════════════════════════════════════════════════
   五点五、山景 ｜ 5.5 THE MOUNTAIN

   山景不是一张固定比例的图，而是<b>按框的形状现画的</b>。
   原因很实际：SLS 的 iframe 宽 100%、高 450px，投影机上是 1600×188 的细长带，
   学生手机上却接近正方形。固定 viewBox 的话，一边会被裁掉大半。
   所有座标因此都写成 0–1 的比例，画的时候再乘上当下的宽高。
   The scenery is generated to fit its box rather than drawn at a fixed aspect.
   Practical reason: the SLS iframe is 100% wide and 450px tall, so the band is
   a 1600x188 ribbon on a projector but nearly square on a student's phone. A
   fixed viewBox would crop most of one of them away. So every coordinate is a
   0-1 fraction, multiplied by the real width and height at paint time.
   ══════════════════════════════════════════════════════════════ */
/* ▼▼▼ SCENE-START ▼▼▼  tools/build-scene.py 会把这一段抽出去给网页用
   Extracted by tools/build-scene.py for the website pages — edit here only. */
/* 山丘的高点（比例）—— 只给这几个点，中间的起伏由 smoothD() 补成圆缓的曲线
   The hilltops as fractions; smoothD() rounds the gaps into rolling curves */
/* 三条山脊都从左边低处一路升到右边的山顶 ——
   横平的山形配一条上扬的小路，看起来只是路在爬，山没有在爬。
   All three ridges climb from a low left to the summit on the right. Level
   ridges under a rising path read as "the path climbs", not "we are climbing". */
const FARn  = [[0,.63],[.20,.51],[.40,.47],[.57,.34],[.735,.19],[.88,.28],[1,.25]];
const MIDn  = [[0,.79],[.20,.69],[.40,.63],[.58,.52],[.75,.41],[.90,.48],[1,.46]];
const NEARn = [[0,.94],[.22,.86],[.44,.79],[.64,.70],[.82,.72],[1,.70]];
const SUMMIT = [.735,.19];     /* 插旗的地方 ｜ where the flag goes */
const SUN    = [.915,.165];    /* 太阳，离旗子远远的 ｜ the sun, well clear of the flag */
const TRAILn = [[.04,.965],
  [.20,.92,.13,.835,.30,.808], [.46,.782,.34,.675,.50,.648],
  [.62,.625,.55,.505,.655,.435], [.71,.392,.69,.262,SUMMIT[0],SUMMIT[1]]];

const px = (n,W,H) => n.map(([x,y])=>[+(x*W).toFixed(1), +(y*H).toFixed(1)]);

/* 折线 → 圆缓的曲线（Catmull-Rom 转贝塞尔）。
   山要「连绵」不要「锯齿」，靠的就是这一步：只给高点，让曲线自己圆过去。
   Polyline -> rolling curve (Catmull-Rom converted to beziers). This is what
   makes the hills roll instead of zigzag: give only the hilltops and let the
   curve round its own way between them. */
function smoothD(pts){
  let d = 'M' + pts[0][0] + ',' + pts[0][1];
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || pts[i+1];
    d += ' C' + (p1[0]+(p2[0]-p0[0])/6).toFixed(1) + ',' + (p1[1]+(p2[1]-p0[1])/6).toFixed(1) +
         ' '  + (p2[0]-(p3[0]-p1[0])/6).toFixed(1) + ',' + (p2[1]-(p3[1]-p1[1])/6).toFixed(1) +
         ' '  + p2[0] + ',' + p2[1];
  }
  return d;
}
const hill = (pts,W,H) => smoothD(pts) + ' L'+W+','+H + ' L0,'+H + ' Z';

/* 曲线上某一点的高度 —— 树要长在山坡上，不能浮在半空
   Height of the curve at x, so trees sit on the slope instead of hovering */
function curveY(pts,x){
  for(let i=1;i<pts.length;i++){
    if(x <= pts[i][0]){
      const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
      const t = (x-x0)/(x1-x0 || 1);
      return y0 + (y1-y0) * (t*t*(3-2*t));      /* 平滑内插，配合圆缓的山形 ｜ smoothstep, to match */
    }
  }
  return pts[pts.length-1][1];
}
/* 圆头的树，配得上圆缓的山 ｜ round-topped trees, to match round-topped hills */
function trees(pts,n,h,W,fill){
  let o = '';
  for(let i=0;i<n;i++){
    const x = W*(.03 + i*(.94/(n-1))), y = curveY(pts,x)+1;
    const r = h*.44;
    o += '<g transform="translate('+x.toFixed(1)+','+y.toFixed(1)+')" fill="'+fill+'">' +
         '<rect x="'+(-h*.07).toFixed(1)+'" y="'+(-h*.34).toFixed(1)+'" width="'+(h*.14).toFixed(1)+
           '" height="'+(h*.36).toFixed(1)+'"/>' +
         '<circle cx="0" cy="'+(-h*.55).toFixed(1)+'" r="'+r.toFixed(1)+'"/>' +
         '<circle cx="'+(-r*.7).toFixed(1)+'" cy="'+(-h*.34).toFixed(1)+'" r="'+(r*.72).toFixed(1)+'"/>' +
         '<circle cx="'+(r*.7).toFixed(1)+'" cy="'+(-h*.34).toFixed(1)+'" r="'+(r*.72).toFixed(1)+'"/></g>';
  }
  return o;
}
/* 云会慢慢飘 —— 动画写在 CSS 里，外层管飘、内层管摆位，两个 transform 才不打架
   Drifting clouds: the animation is CSS. An outer <g> drifts and an inner <g>
   positions, so the two transforms don't fight over the same attribute */
function clouds(list,W,H){
  return list.map(([fx,fy,sc,o],i)=>
    '<g class="cloud c'+(i%4)+'">' +
      '<g transform="translate('+(fx*W).toFixed(1)+','+(fy*H).toFixed(1)+') scale('+(sc*H/135).toFixed(3)+')" opacity="'+o+'">' +
        '<ellipse cx="0" cy="0" rx="17" ry="8"/><ellipse cx="13" cy="3" rx="12" ry="6.5"/>' +
        '<ellipse cx="-13" cy="3" rx="11" ry="6"/><ellipse cx="4" cy="-6" rx="10.5" ry="7"/>' +
        '<ellipse cx="-6" cy="-4" rx="9" ry="6"/></g></g>').join('');
}
/* 小路上某个比例位置的座标。
   画面上的人物是用 getPointAtLength() 从 <path> 上量的，但这里是在<b>生成</b>
   SVG 字串，还没有 DOM 可量，所以直接把贝塞尔算出来。
   Where a given fraction along the trail falls. The in-game character is
   measured off the live <path> with getPointAtLength(), but here the SVG string
   is still being generated and there is no DOM to measure, so the bezier is
   evaluated directly. */
function trailPoint(f, W, H){
  const segs = TRAILn.length - 1;
  const t = Math.max(0, Math.min(0.9999, f)) * segs;
  const i = Math.floor(t), u = t - i;
  const p0 = i === 0 ? [TRAILn[0][0], TRAILn[0][1]]
                     : [TRAILn[i][4], TRAILn[i][5]];
  const c = TRAILn[i + 1];
  const pts = [p0, [c[0],c[1]], [c[2],c[3]], [c[4],c[5]]];
  const m = 1 - u;
  const x = m*m*m*pts[0][0] + 3*m*m*u*pts[1][0] + 3*m*u*u*pts[2][0] + u*u*u*pts[3][0];
  const y = m*m*m*pts[0][1] + 3*m*m*u*pts[1][1] + 3*m*u*u*pts[2][1] + u*u*u*pts[3][1];
  return [x*W, y*H];
}

function trailD(W,H){
  let d = 'M' + (TRAILn[0][0]*W).toFixed(1) + ',' + (TRAILn[0][1]*H).toFixed(1);
  for(let i=1;i<TRAILn.length;i++){
    const c = TRAILn[i];
    d += ' C' + (c[0]*W).toFixed(1)+','+(c[1]*H).toFixed(1) + ' ' +
                (c[2]*W).toFixed(1)+','+(c[3]*H).toFixed(1) + ' ' +
                (c[4]*W).toFixed(1)+','+(c[5]*H).toFixed(1);
  }
  return d;
}

let sceneN = 0;   /* 同一页上好几幅山景，渐层 id 不能撞 ｜ ids must not collide between scenes */

function sceneSVG(o){
  o = o || {};
  const H = 220, W = Math.round(H * Math.max(.75, Math.min(6, o.aspect || 1.8)));
  const u = '_' + (++sceneN);
  const far = px(FARn,W,H), mid = px(MIDn,W,H), near = px(NEARn,W,H);
  const sx = SUMMIT[0]*W, sy = SUMMIT[1]*H;
  const sunX = SUN[0]*W, sunY = SUN[1]*H;
  const av = H*.15, flag = H*.125;

  const cell = (id,x,y,w,row,col) =>
    '<svg' + (id?' id="'+id+'"':'') + ' x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+
    '" width="'+w.toFixed(1)+'" height="'+(w*CELL_H/CELL_W).toFixed(1)+
    '" viewBox="'+(col*CELL_W)+' '+(row*CELL_H)+' '+CELL_W+' '+CELL_H+'">' +
    '<image href="'+AV_SRC+'" x="0" y="0" width="'+(AV_COLS*CELL_W)+'" height="'+(AV_ROWS*CELL_H)+
    '" style="image-rendering:pixelated"/></svg>';

  /* 推近山顶时，取景框要<b>夹在画面之内</b>。
     不夹的话，框会越过右边界 —— 那一块没有东西可画，露出的是页面底色，
     看起来就像风景旁边多了一条黑带。
     When pushing in on the summit, the window must be clamped inside the
     artwork. Unclamped it runs past the right edge, where there is nothing to
     paint, and the page background shows through as a dark band beside the
     scenery. */
  let vb = '0 0 '+W+' '+H;
  if(o.zoom){
    const vw = W*o.zoom, vh = H*o.zoom;
    const vx = Math.max(0, Math.min(W - vw, sx - vw*.42));
    const vy = Math.max(0, Math.min(H - vh, sy - vh*.30));
    vb = [vx.toFixed(1), vy.toFixed(1), vw.toFixed(1), vh.toFixed(1)].join(' ');
  }

  return '<svg viewBox="'+vb+'" preserveAspectRatio="'+(o.fit||'xMidYMid slice')+'">' +
    '<defs>' +
      /* 蓝天：上头深一点，接近地平线转淡 ｜ blue sky, paler toward the horizon */
      '<linearGradient id="sky'+u+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#2b8fd6"/><stop offset=".55" stop-color="#79c4ee"/>' +
        '<stop offset="1" stop-color="#cfeafb"/></linearGradient>' +
      '<radialGradient id="glow'+u+'"><stop offset="0" stop-color="#FFE479" stop-opacity=".95"/>' +
        '<stop offset=".45" stop-color="#FFC72C" stop-opacity=".45"/>' +
        '<stop offset="1" stop-color="#FFC72C" stop-opacity="0"/></radialGradient>' +
      /* 三层绿：远淡近深，做出纵深 ｜ three greens, hazier far away */
      '<linearGradient id="far'+u+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#9fd3ae"/><stop offset="1" stop-color="#77b98f"/></linearGradient>' +
      '<linearGradient id="mid'+u+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#5cae76"/><stop offset="1" stop-color="#3c8a57"/></linearGradient>' +
      '<linearGradient id="near'+u+'" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#358f57"/><stop offset="1" stop-color="#1c6238"/></linearGradient>' +
    '</defs>' +
    '<rect width="'+W+'" height="'+H+'" fill="url(#sky'+u+')"/>' +
    /* 太阳：黄，外面一圈会呼吸的光晕 ｜ a yellow sun inside a breathing halo */
    '<g class="sun"><circle cx="'+sunX.toFixed(1)+'" cy="'+sunY.toFixed(1)+'" r="'+(H*.27).toFixed(1)+
      '" fill="url(#glow'+u+')"/></g>' +
    '<circle cx="'+sunX.toFixed(1)+'" cy="'+sunY.toFixed(1)+'" r="'+(H*.075).toFixed(1)+'" fill="#FFDC4A"/>' +
    '<circle cx="'+sunX.toFixed(1)+'" cy="'+sunY.toFixed(1)+'" r="'+(H*.054).toFixed(1)+'" fill="#FFF3B0"/>' +
    '<g fill="#ffffff">' + clouds([[.18,.22,1,.9],[.60,.14,.82,.78],[.40,.33,.6,.62],[.88,.38,.7,.5]],W,H) + '</g>' +
    '<path d="'+hill(far,W,H)+'"  fill="url(#far'+u+')"/>' +
    '<path d="'+hill(mid,W,H)+'"  fill="url(#mid'+u+')"/>' +
    trees(mid, Math.max(5, Math.round(W/95)), H*.045, W, '#2f7a4c') +
    '<path d="'+hill(near,W,H)+'" fill="url(#near'+u+')"/>' +
    trees(near, Math.max(6, Math.round(W/62)), H*.07, W, '#14512d') +
    '<path'+(o.trail?' id="'+o.trail+'"':'')+' d="'+trailD(W,H)+'" fill="none" stroke="#FFC72C" ' +
      'stroke-width="'+(H*.009).toFixed(2)+'" stroke-dasharray="'+(H*.023).toFixed(1)+' '+(H*.027).toFixed(1)+
      '" stroke-linecap="round" opacity=".8"/>' +
    '<g transform="translate('+sx.toFixed(1)+','+sy.toFixed(1)+')">' +
      '<line x1="0" y1="0" x2="0" y2="'+(-flag).toFixed(1)+'" stroke="#8a5a2b" stroke-width="'+(H*.011).toFixed(2)+'"/>' +
      '<path d="M0,'+(-flag).toFixed(1)+' L'+(flag*.72).toFixed(1)+','+(-flag*.75).toFixed(1)+
        ' L0,'+(-flag*.5).toFixed(1)+' Z" fill="#FFC72C"/></g>' +
    /* 站在旗子旁边的山坡上 —— 脚底的高度要从山形曲线上量，
       照搬山顶的高度就会浮在半空（旗子左边的地面本来就比较低）。
       Standing on the slope beside the flag: the feet height is measured off
       the hill curve. Reusing the summit's height would leave the character
       hovering, because the ground left of the flag is lower. */
    (o.avatar == null ? '' : (function(){
      /* avatarAt 有值就停在小路上那个位置（还没登顶），否则站在旗子旁边欢呼
         With avatarAt the character stands partway up the trail (not yet at the
         top); without it, it cheers beside the flag */
      if(o.avatarAt != null){
        const [px_, py_] = trailPoint(o.avatarAt, W, H);
        return cell(null, px_ - av/2, py_ - av*CELL_H/CELL_W, av, avRow(o.avatar), 0);
      }
      const ax = sx - av*1.15;
      return cell(null, ax - av/2, curveY(far, ax) - av*CELL_H/CELL_W, av, avRow(o.avatar), 3);
    })()) +
    (o.hiker ? cell('hiker', 0, 0, H*.17, avRow(S.av), 0) : '') +
  '</svg>';
}

/* ▲▲▲ SCENE-END ▲▲▲ */

/* 量好一个容器的形状，再把山景画进去 ｜ measure a container, then paint the scene into it */
function fitScene(node, o){
  if(!node) return;
  const w = node.clientWidth || 400, h = node.clientHeight || 220;
  node.innerHTML = sceneSVG(Object.assign({aspect: w/Math.max(1,h)}, o||{}));
}

/* 山景占多少，由题目说了算。
   风景是好看，但版面挤到卡片要滚动就本末倒置了 —— 所以每换一个版面就量一次：
   格子塞得下，山景就留在 42%；塞不下，山景让位，最低让到 92px。
   The scenery yields to the task. It looks good, but a panel that has to be
   scrolled defeats the point — so each panel is measured: if the slots fit,
   the scenery keeps its 42%; if not, it gives the space back, down to 92px. */
function fitBand(){
  const box = $('climb'), full = Math.round(stage.clientHeight * .42);
  box.style.height = Math.min(208, Math.max(120, full)) + 'px';
  /* 量到不再溢出为止 —— 让位一次不够，就再让一次 ｜ shrink until it fits */
  for(let i=0;i<4;i++){
    const over = overflowNow();
    if(over <= 2) break;
    const h = Math.max(80, box.clientHeight - over - 6);
    if(h === box.clientHeight) break;
    box.style.height = h + 'px';
  }
  paintBand();
}

function overflowNow(){
  let o = Math.max(slotsEl.scrollHeight - slotsEl.clientHeight,
                   poolEl.scrollHeight  - poolEl.clientHeight);
  const q = slotsEl.querySelector('.qbox');
  if(q) o = Math.max(o, q.scrollHeight - q.clientHeight);
  return o;
}
function ensureFit(){
  const over = overflowNow();
  if(over <= 2) return;
  const box = $('climb');
  box.style.height = Math.max(80, box.clientHeight - over - 5) + 'px';
  /* 只改高度不重画：viewBox 没变，人物的座标依然算数，画面只是重新取景
     Height only, no repaint: the viewBox is unchanged so the character's
     coordinates still hold; the scene simply re-crops. */
  clearTimeout(bandTimer);
  bandTimer = setTimeout(paintBand, 240);
}

/* 登山带：整幅山景 + 一个沿着小路走的人物 ｜ the band: full scene plus a walker */
function paintBand(){
  const box = $('climb');
  const asp = box.clientWidth / Math.max(1, box.clientHeight);
  box.innerHTML = sceneSVG({trail:'trailMain', hiker:true, aspect:asp});
  walkAt = -1;                     // 强制重新落位 ｜ force a re-seat on the new geometry
  climbTo(donePanels() / allPanels());
}
/* 转屏、投影、键盘收起 —— 形状一变就重画，免得被裁掉
   Rotation, projector, keyboard dismissal: repaint on shape change so nothing crops */
let bandTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(bandTimer);
  bandTimer = setTimeout(()=>{ P ? fitBand() : paintBand(); }, 160);
});

/* 选单上的顺序与名称。贴图里的行号是按 art/ 的档名排的，跟这里的顺序不一样 ——
   AV_ROW 就是这两者之间的对照表，所以换顺序不必动图、也不必改档名。
   The order and names shown in the picker. The sheet's row order follows the
   filenames in art/, which is not this order; AV_ROW maps between the two, so
   rearranging the picker touches neither the artwork nor the filenames. */
const AV_NAMES = ['短发女生', '长发女生', '平头男生', '短发男生'];
const AV_ROW   = [2, 1, 3, 0];          // 选单第 n 个 → 贴图第几行 ｜ picker index -> sheet row
const avRow = i => AV_ROW[i] != null ? AV_ROW[i] : 0;

/* 把某个头像的某个姿势画进任意大小的方块里 ｜ paint one avatar+pose at any size */
function paintAvatar(el, av, frame, w){
  const h = w * CELL_H / CELL_W, row = avRow(av);
  el.style.width  = w + 'px';
  el.style.height = h + 'px';
  el.style.backgroundImage    = 'url(' + AV_SRC + ')';
  el.style.backgroundSize     = (w*AV_COLS) + 'px ' + (h*AV_ROWS) + 'px';
  el.style.backgroundPosition = (-frame*w) + 'px ' + (-row*h) + 'px';
  el.style.backgroundRepeat   = 'no-repeat';
  return h;
}

/* ══════════════════════════════════════════════════════════════
   六点五、音效与音乐 ｜ 6.5 SOUND AND MUSIC
   全部用 Web Audio 即时合成，没有任何音档：
   档案不变大，SLS sandbox 里也响得出来，也不牵涉音乐版权。
   Synthesised live in Web Audio — no audio files at all: nothing bloats the
   file, it plays inside the SLS sandbox, and no music licensing is involved.
   ══════════════════════════════════════════════════════════════ */
const SFX = {
  ctx:null, on:true,
  boot(){ if(this.ctx) return;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; } },
  /* 浏览器要先有一次使用者操作才准出声 ｜ browsers need a user gesture before any sound */
  wake(){ this.boot(); if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  note(f,t0,dur,type,vol,f2){
    if(!this.on) return; this.boot(); if(!this.ctx) return;
    const c=this.ctx, o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||.1,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
  },
  seq(l,type,vol){ l.forEach(n=>this.note(n[0],n[1],n[2],type,vol)); },
  pickUp(){ this.note(660,0,.07,'square',.07,880); },                     /* 拿起卡片 ｜ card picked up */
  right(){  this.seq([[523,0,.08],[784,.07,.14]],'square',.09); },        /* 放对 ｜ correct */
  wrong(){  this.note(300,0,.15,'sawtooth',.07,170); },                   /* 放错 ｜ wrong */
  panel(){  this.seq([[659,0,.09],[784,.09,.09],[988,.18,.09],[1319,.27,.26]],'square',.1); },
  level(){  this.seq([[523,0,.11],[659,.11,.11],[784,.22,.11],[1047,.33,.3]],'square',.11); },
  win(){    this.seq([[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.16],
                      [784,.54,.1],[1047,.64,.46]],'square',.12); },
  toggle(){
    this.on=!this.on; this.wake(); save();
    $('sndBtn').textContent = this.on?'🔊':'🔇';
    $('sndBtn').classList.toggle('off', !this.on);
    if(this.on){ this.note(880,0,.08,'square',.1); if(BGM.on) BGM.start(); } else BGM.stop();
  }
};

/* 八小节循环，走山路的调子 ｜ an eight-bar loop, a walking-uphill tune */
const BGM = {
  on:true, vol:.8, bpm:96, gain:null, timer:null, next:0, step:0, ducked:false,
  mel:[
    392,0,440,0,494,0,440,0,   392,0,330,0,392,0,0,0,
    440,0,494,0,587,0,494,0,   440,0,392,0,440,0,0,0,
    494,0,587,0,659,0,587,0,   523,0,494,0,440,0,0,0,
    392,440,494,523,587,0,659,0, 587,0,494,0,392,0,0,0
  ],
  bass:[
    196,0,0,0,196,0,0,0,  165,0,0,0,165,0,0,0,
    147,0,0,0,147,0,0,0,  175,0,0,0,175,0,0,0,
    196,0,0,0,196,0,0,0,  165,0,0,0,165,0,0,0,
    131,0,0,0,131,0,0,0,  147,0,0,0,165,0,0,0
  ],
  ensure(){ SFX.boot(); const c=SFX.ctx; if(!c) return false;
    if(!this.gain){ this.gain=c.createGain(); this.gain.gain.value=this.vol; this.gain.connect(c.destination); }
    return true; },
  voice(f,t,dur,type,vol){
    const c=SFX.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.gain); o.start(t); o.stop(t+dur+.03);
  },
  tick(){
    const c=SFX.ctx; if(!c||!this.on||!SFX.on) return;
    const spb = 60/this.bpm/2;
    while(this.next < c.currentTime + .3){
      const i = this.step % 64;
      if(this.mel[i])  this.voice(this.mel[i],  this.next, spb*.9,  'square',   .04);
      if(this.bass[i]) this.voice(this.bass[i], this.next, spb*1.7, 'triangle', .055);
      this.next += spb; this.step++;
    }
  },
  start(){ if(!this.on||!SFX.on||!this.ensure()) return; SFX.wake();
    if(this.timer) return; this.next = SFX.ctx.currentTime + .12;
    this.timer = setInterval(()=>this.tick(), 60); },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  /* 读题时把音乐压小声 ｜ duck the music while there is something to read */
  duck(on){ if(this.gain && SFX.ctx && on!==this.ducked){ this.ducked=on;
    this.gain.gain.setTargetAtTime(on?this.vol*.3:this.vol, SFX.ctx.currentTime, .1); } },
  toggle(){ this.on=!this.on; save();
    $('bgmBtn').classList.toggle('off', !this.on);
    if(this.on){ SFX.wake(); this.start(); } else this.stop(); }
};

/* ══════════════════════════════════════════════════════════════
   六点六、计时 ｜ 6.6 THE CLIMB CLOCK
   累计的是「真的在答题的时间」，不是从第一次打开算到现在的钟面时间 ——
   这个组件跨三节课用，中间隔着一两天，钟面时间没有意义。
   Counts time actually spent answering, not wall-clock since first launch:
   the component spans three lessons days apart, so wall-clock would be
   meaningless. Paused on the menus and whenever the tab is hidden.
   ══════════════════════════════════════════════════════════════ */
const CLOCK = {
  running:false,
  fmt(t){ const m=Math.floor(t/60), sec=t%60;
    return (m>=60 ? Math.floor(m/60)+':'+String(m%60).padStart(2,'0') : String(m)) +
           ':' + String(sec).padStart(2,'0'); },
  lap(i){ return S.laps[i]|0; },
  total(){ return S.laps.reduce((a,b)=>a+(b|0), 0); },
  paint(){ $('clock').textContent = '⏱ ' + this.fmt(this.total()); },
  run(on){ this.running = on && !document.hidden; },
  tick(){
    if(!this.running) return;
    S.laps[S.lv] = (S.laps[S.lv]|0) + 1;    // 记在当下这一关头上 ｜ charged to the level in play
    this.paint();
    if(this.total() % 15 === 0) save();
  }
};
setInterval(()=>CLOCK.tick(), 1000);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) CLOCK.running = false; });

/* ══════════════════════════════════════════════════════════════
   七、画面元素 ｜ 7. ELEMENTS
   ══════════════════════════════════════════════════════════════ */
const $  = id => document.getElementById(id);
const el = (t,c,h)=>{ const e=document.createElement(t); if(c)e.className=c;
                      if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

const stage=$('stage'), fieldEl=$('field'), poolEl=$('pool'), slotsEl=$('slots'), srcEl=$('src'),
      tipEl=$('tip'), fbEl=$('fb'), goBtn=$('goBtn'),
      lvNameEl=$('lvName'), progEl=$('prog'), scoreEl=$('score');

/* 每个覆盖画面都长一个样：底下一整片山景，上面一个放文字的框
   Every overlay screen has the same shell: scenery behind, text panel on top */
function paintScr(id, html, sceneOpt){
  $(id).innerHTML = '<div class="scene"></div><div class="box">' + html + '</div>';
  showScr(id);
  fitScene($(id).querySelector('.scene'), sceneOpt || {});
}

function showScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on', s.id===id));
  const playing = !id;
  fieldEl.style.visibility = playing ? 'visible' : 'hidden';

  BGM.duck(!playing);

/* ══════════════════════════════════════════════════════════════
   八、关卡进行 ｜ 8. PLAYING A PANEL

   计分规则：每张卡片<b>第一次</b>就放对才得 1 分。
   放错的卡片轻弹回原位 —— 不扣分、不设生命值，学生可以一直试到对为止，
   所以人人都能走完全程；但分数记的是第一次的判断，教师后台才有诊断价值。
   Scoring: a card earns its mark only if it is placed correctly on the FIRST
   try. A wrong drop springs back — no penalty, no lives — so every student
   finishes; but the mark reflects the first judgement, which is what makes the
   gradebook number worth reading.
   ══════════════════════════════════════════════════════════════ */
let P = null;          // 当前版面 ｜ the panel in play
let goAction = null;   // 底栏按钮此刻做什么 ｜ what the action button does right now

const allPanels = () => LEVELS.reduce((a,l)=>a+l.panels.length, 0);
const donePanels = () => S.marks.reduce((a,m)=>a+m.filter(v=>v!=null).length, 0);

function setGo(label, fn, on){
  goBtn.innerHTML = label;
  goBtn.disabled = !on;
  goAction = on ? fn : null;
}
function say(msg, kind){
  fbEl.className = kind || '';
  fbEl.innerHTML = msg || '';
}

/* ──────── 人物在小路上的动作 ｜ the character on the trail ────────
   位置直接从 <path> 上量出来，不另外维护一组座标 —— 小路怎么画，人就怎么走。
   Positions are measured off the <path>, so there is no second copy of the
   geometry to keep in sync: wherever the trail goes, the character goes. */
let walkTimer = null, walkRAF = 0, walkAt = 0;

const hikerEl   = () => document.getElementById('hiker');
const trailEl   = () => document.getElementById('trailMain');

/* 换姿势：巢状 <svg> 的 viewBox 往右移一格，就换一张图
   Change pose: shift the nested <svg>'s viewBox one cell to the right */
function hikerFace(col){
  const h = hikerEl();
  if(h) h.setAttribute('viewBox',
    (col*CELL_W) + ' ' + (avRow(S.av)*CELL_H) + ' ' + CELL_W + ' ' + CELL_H);
}
/* 落位：脚底踩在小路上 ｜ seat the character with its feet on the trail */
function hikerSeat(frac){
  const h = hikerEl(), path = trailEl();
  if(!h || !path) return;
  const pt = path.getPointAtLength(Math.max(0, Math.min(1, frac)) * path.getTotalLength());
  const w = parseFloat(h.getAttribute('width'));
  h.setAttribute('x', pt.x - w/2);
  h.setAttribute('y', pt.y - w*CELL_H/CELL_W);
}
function stopWalk(){
  clearInterval(walkTimer); walkTimer = null;
  cancelAnimationFrame(walkRAF); walkRAF = 0;
}

/* 走一段路。时间跟距离成正比 —— 走两步和走半座山不该花一样久，
   否则远的那段看起来就是「飘」过去的。
   Walk a stretch. The duration scales with the distance: two steps and half a
   mountain should not take the same time, or the long one reads as gliding. */
function climbTo(frac, then){
  const path = trailEl(), h = hikerEl();
  if(!path || !h) return;
  const to = Math.max(0, Math.min(1, frac));
  const from = walkAt < 0 ? to : walkAt;
  const dist = Math.abs(to - from);

  stopWalk();
  hikerSeat(from);
  if(dist < .0015){ hikerFace(POSE.stand); walkAt = to; then && then(); return; }

  const dur = Math.min(2600, 420 + dist * 2600);
  const t0 = performance.now();
  let step = 0;
  /* 交替两个走路姿势 ｜ alternate the two walking poses */
  walkTimer = setInterval(()=>hikerFace((++step % 2) ? POSE.walkA : POSE.walkB), 135);
  hikerFace(POSE.walkA);

  (function frame(now){
    const k = Math.min(1, ((now || performance.now()) - t0) / dur);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;   /* 起步与收步都放慢 ｜ ease in and out */
    hikerSeat(from + (to - from) * e);
    if(k < 1) walkRAF = requestAnimationFrame(frame);
    else { stopWalk(); hikerFace(POSE.stand); walkAt = to; then && then(); }
  })(t0);
}

/* 答错了：滑一跤，退半步，再自己站起来爬回去。
   不扣分、不重来 —— 但那一下踩空是看得见的，比一行红字管用。
   A wrong answer: slip, slide back half a step, then get up and climb back.
   Nothing is lost and nothing restarts, but the misstep is visible, which
   lands better than a line of red text. */
function stumble(){
  const h = hikerEl();
  if(!h || !trailEl()) return;
  const at = walkAt < 0 ? 0 : walkAt;
  const slipTo = Math.max(0, at - .022);

  stopWalk();
  hikerFace(POSE.fall);

  const t0 = performance.now(), dur = 260;
  (function slide(now){
    const k = Math.min(1, ((now || performance.now()) - t0) / dur);
    hikerSeat(at + (slipTo - at) * k);
    if(k < 1) walkRAF = requestAnimationFrame(slide);
    else{
      walkAt = slipTo;
      /* 趴一下再起来 ｜ stay down a beat, then get up */
      setTimeout(()=>{
        hikerFace(POSE.stand);
        setTimeout(()=>climbTo(at), 200);      // 爬回刚才的位置 ｜ climb back to where it was
      }, 420);
    }
  })(t0);
}

function renderPanel(){
  const L = LEVELS[S.lv], d = L.panels[S.pi];
  showScr(null);

  lvNameEl.textContent = L.n;
  progEl.innerHTML = '版面 ' + (S.pi+1) + '/' + L.panels.length +
                     ' · <b>' + esc(d.hd) + '</b>';
  scoreEl.textContent = total() + ' / ' + MAX;
  /* 课文名以粗体标出，段落跟在后面 ｜ the text in bold, the paragraph after it */
  $('src').innerHTML = d.src
    ? '<span class="en">In your textbook</span>📖 ' +
      zh(esc(d.src).replace(/^([^·]+)·/, '<b>$1</b>·'))
    : '';
  tipEl.innerHTML = zh(d.tip.zh) + '<span class="en">' + esc(d.tip.en) + '</span>';
  poolEl.innerHTML = ''; slotsEl.innerHTML = '';
  poolEl.className = ''; slotsEl.style.gridTemplateColumns = '';
  say('');

  P = {d:d, cards:[], slots:[], marks:0, max:panelMax(d), settled:false};

  if(d.k === 'slots') buildSlots(d);
  else buildQuestion(d);
  fitBand();                    // 先量再画 ｜ measure, then paint
  CLOCK.paint(); CLOCK.run(true); BGM.duck(false);
}

/* ──────── 拖曳版面 ｜ the drag-and-drop panels ──────── */
function buildSlots(d){
  slotsEl.style.gridTemplateColumns = 'repeat(' + (d.cols||2) + ',minmax(0,1fr))';

  d.slots.forEach((sd, i)=>{
    const s = el('div','slot');
    s.innerHTML = '<div class="hd">' + zh(sd.t) +
                  (sd.sub ? '<small>' + esc(sd.sub) + '</small>' : '') + '</div>';
    const drop = el('div', 'drop' + (d.flow === 'row' ? ' row' : ''));
    s.appendChild(drop);
    s._i = i; s._drop = drop; s._items = [];
    s.addEventListener('click', ()=>{ if(selected) tryPlace(selected, i); });
    slotsEl.appendChild(s);
    P.slots.push(s);
  });

  /* 打散卡片。光洗一次不够 —— 洗出来刚好还是格子的顺序，机率并不低：
     四张卡是 1/24，一班三十几个学生，总会有人拿到「照顺序拖就全对」的一手，
     那一题就白出了。所以洗到顺序<b>不是</b>正序也不是逆序为止。
     Shuffling once is not enough: landing back in slot order has odds of about
     1 in 24 for a four-card panel, so in a class of thirty someone would get a
     hand they can solve by dragging left to right without reading. Reshuffle
     until the order is neither ascending nor descending. */
  shuffled(d.cards).forEach(c=>{
    const e = el('div','card', zh(c.t));
    e._c = c; e._first = true;
    arm(e);
    poolEl.appendChild(e);
    P.cards.push(e);
  });
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/* 顺序是否「排好了」——正序或逆序都算。
   正序＝照格子从左到右拖就全对；逆序＝从右到左。两种都要避开。
   对「挑出正确的几张」那种版面，s 只有 0 与 -1 两种值，这个检查同样挡掉
   「正确的全挤在前面／后面」。
   Is the order 'solved'? Ascending means dragging left to right works without
   reading; descending is the same trick backwards. For the pick-N panels, where
   s is only 0 or -1, this equally prevents the correct cards from clumping at
   one end. */
function inOrder(cards){
  const v = cards.map(c=>c.s);
  if(new Set(v).size < 2) return false;
  let asc = true, desc = true;
  for(let i=1;i<v.length;i++){
    if(v[i] < v[i-1]) asc = false;
    if(v[i] > v[i-1]) desc = false;
  }
  return asc || desc;
}
function shuffled(cards){
  let a = cards.slice();
  for(let i=0;i<50 && (i===0 || inOrder(a));i++) a = shuffle(cards.slice());
  return a;
}

/* ──────── 拖曳与点选 ｜ dragging and tapping ────────
   两种操作都支援：iPad 上用手指拖，或者「点卡片 → 点格子」。
   课室里第二种其实更可靠 —— 手指一抖，拖到一半的卡片就掉了。
   Both work: drag with a finger, or tap the card then tap the slot. In a
   classroom the second is the reliable one — a shaky finger drops the card. */
let selected = null, drag = null;

function arm(e){
  e.addEventListener('pointerdown', onDown);
}
function disarm(e){
  e.removeEventListener('pointerdown', onDown);
}

function onDown(ev){
  const e = ev.currentTarget;
  if(e.classList.contains('placed')) return;
  ev.preventDefault();
  const r = e.getBoundingClientRect();
  drag = {e:e, id:ev.pointerId, x0:ev.clientX, y0:ev.clientY,
          dx:ev.clientX-r.left, dy:ev.clientY-r.top, w:r.width, moved:false, ghost:null};
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
}

function onMove(ev){
  if(!drag || ev.pointerId !== drag.id) return;
  if(!drag.moved){
    if(Math.hypot(ev.clientX-drag.x0, ev.clientY-drag.y0) < 7) return;
    drag.moved = true;
    const g = drag.e.cloneNode(true);
    g.classList.add('ghost');
    g.style.width = drag.w + 'px';
    document.body.appendChild(g);
    drag.ghost = g;
    drag.e.style.opacity = '.3';
  }
  drag.ghost.style.left = (ev.clientX - drag.dx) + 'px';
  drag.ghost.style.top  = (ev.clientY - drag.dy) + 'px';
  hot(slotUnder(ev.clientX, ev.clientY));
}

function onUp(ev){
  if(!drag || ev.pointerId !== drag.id) return;
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  window.removeEventListener('pointercancel', onUp);
  const d = drag; drag = null;
  hot(null);

  if(!d.moved){                       // 只是点了一下 → 选取 ｜ a tap: select it
    pick(d.e === selected ? null : d.e);
    return;
  }
  d.ghost.remove();
  d.e.style.opacity = '';
  const s = slotUnder(ev.clientX, ev.clientY);
  if(s) tryPlace(d.e, s._i);
}

function slotUnder(x,y){
  const n = document.elementFromPoint(x,y);
  return n ? n.closest('.slot') : null;
}
function hot(s){
  P && P.slots.forEach(x=>x.classList.toggle('hot', x===s));
}
function pick(e){
  if(selected) selected.classList.remove('sel');
  selected = e;
  if(e){ e.classList.add('sel'); SFX.pickUp();
         say('已选中，再点一个格子放进去。<span class="en">Selected — now tap a slot.</span>'); }
  else say('');
}

function tryPlace(e, i){
  const c = e._c, s = P.slots[i], cap = P.d.cap || 1;
  if(s._items.length >= cap){
    say('这个格子满了。<span class="en">That slot is full.</span>', 'bad');
    return;
  }
  if(c.s !== i){                      // 放错 ｜ wrong slot
    e._first = false;                 // 这一分没了，但可以继续试 ｜ mark lost, tries continue
    e.classList.add('bad');
    setTimeout(()=>e.classList.remove('bad'), 360);
    SFX.wrong(); stumble();
    pick(null);                       // 先取消选取，再说话 —— pick() 会清掉提示
    say('再想想 —— 这张放在别处。<span class="en">Not quite. Try another slot.</span>', 'bad');
    return;
  }
  if(e._first) P.marks++;             // 一次就对 ｜ right first time
  SFX.right();
  e.classList.remove('sel'); e.classList.add('placed');
  disarm(e);
  s._items.push(e);
  s._drop.appendChild(e);
  s.classList.toggle('full', s._items.length >= cap);
  selected = null;
  if(!poolEl.children.length) poolEl.className = 'empty';
  ensureFit();
  say(e._first ? '对了！<span class="en">Correct.</span>' : '对了。<span class="en">Correct.</span>', 'good');

  const need = P.d.cards.filter(x=>x.s>=0).length;
  const done = P.slots.reduce((a,x)=>a+x._items.length, 0);
  if(done >= need) settle();
}

/* ──────── 多选与选择题 ｜ multi-select and single-choice ──────── */
function buildQuestion(d){
  poolEl.className = 'empty';
  slotsEl.style.gridTemplateColumns = '1fr';
  const box = el('div','qbox');
  box.innerHTML = '<div class="qstem">' + zh(d.q) + '</div>';
  const opts = el('div','opts');
  const multi = d.k === 'multi';

  /* 选项一样要打散。三选一那题的正确答案写在资料里是第一个 ——
     不洗牌的话，学生做过一次就学会「选第一个」，这跟读懂课文毫无关系。
     多选题同理：正确的两个本来并排在最前面。
     Options get shuffled too. In the data the single-choice answer is written
     first; unshuffled, a student who has seen it once learns "pick the top
     one", which has nothing to do with understanding the text. Same for the
     multi-select, whose two correct options sit together at the front. */
  const list = shuffle((multi ? d.opts : d.opts.map((t,i)=>({t:t, ok:i === d.a}))).slice());

  list.forEach((o,i)=>{
    const b = el('button','opt',
      '<span class="box"></span><span>' + zh(o.t) + '</span>');
    b.type = 'button';
    b.addEventListener('click', ()=>{
      if(P.settled) return;
      if(multi) b.classList.toggle('on');
      else opts.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on', x===b));
      const any = opts.querySelector('.opt.on');
      setGo('确定 Check', check, !!any);
    });
    b._i = i; b._ok = !!o.ok;
    opts.appendChild(b);
  });
  box.appendChild(opts);
  slotsEl.appendChild(box);
  setGo('确定 Check', check, false);

  function check(){
    const bs = [...opts.querySelectorAll('.opt')];
    const right = bs.every(b => b.classList.contains('on') === b._ok);
    if(right){
      P.marks = P.tried ? 0 : 1;                 // 第一次就对才得分 ｜ first try only
      bs.forEach(b=>{ if(b._ok) b.classList.add('right'); });
      SFX.right(); settle();
    }else{
      P.tried = true; SFX.wrong(); stumble();    // 分数没了，但还可以改 ｜ mark lost, retry allowed
      bs.forEach(b=>{
        if(b.classList.contains('on') && !b._ok) b.classList.add('wrong');
      });
      say(multi ? '还没全对 —— 再看看第1段举了几个例子。<span class="en">Not all correct yet. Try again.</span>'
                : '再想想。<span class="en">Have another look.</span>', 'bad');
      setTimeout(()=>bs.forEach(b=>b.classList.remove('wrong')), 900);
    }
  }
}

/* ──────── 版面结束 ｜ panel finished ──────── */
function settle(){
  P.settled = true;
  const prev = S.marks[S.lv][S.pi];
  /* 可以重做，取最好的一次 ｜ replayable; the best attempt stands */
  S.marks[S.lv][S.pi] = Math.max(prev == null ? -1 : prev, P.marks);
  if(!S.doneAt && LEVELS.every((_,i)=>lvDone(i))){
    const n = new Date();
    S.doneAt = n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' +
               String(n.getDate()).padStart(2,'0') + ' ' +
               String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  save();
  scoreEl.textContent = total() + ' / ' + MAX;
  XAPI.sendScore(total(), MAX);            // 每次都送累计总分 ｜ always the running total
  climbTo(donePanels() / allPanels());

  say('<b>' + P.marks + '/' + P.max + '</b> · ' + zh(P.d.e),
      P.marks === P.max ? 'good' : '');

  BGM.duck(true);                         // 有讲解要读 ｜ there is an explanation to read
  const last = S.pi >= LEVELS[S.lv].panels.length - 1;
  if(!last) SFX.panel();
  setGo(last ? '完成本关 Finish' : '下一版面 Next', ()=>{
    if(last) doneLevel(); else { S.pi++; renderPanel(); }
  }, true);
}

goBtn.addEventListener('click', ()=>{ if(goAction) goAction(); });

/* ══════════════════════════════════════════════════════════════
   九、各个画面 ｜ 9. THE SCREENS
   英文只用于系统与导航文字；学习内容一律只用华文。
   English is used for chrome and navigation only — never for the content.
   ══════════════════════════════════════════════════════════════ */

function scrNameShow(){
  paintScr('scrName',
    '<h1>⛰️ 书山登顶</h1>' +
    '<p>单元五《学无止境》· 三关共 ' + MAX + ' 分' +
      '<span class="en">Unit 5 · three levels · ' + MAX + ' marks</span></p>' +
    '<div class="row">' +
      '<span class="field"><label>姓名 Name</label>' +
        '<input id="inName" maxlength="12" autocomplete="off" value="'+esc(S.name)+'"></span>' +
      '<span class="field"><label>班级 Class</label>' +
        '<input id="inCls" maxlength="10" autocomplete="off" value="'+esc(S.cls)+'"></span>' +
    '</div>' +
    '<div class="rules">' +
      '<p><b>① 请在 SLS 里作答，不要另开分页。</b>另开分页，你的分数记录不到。' +
        '<span class="en">Answer inside SLS. Do not open this in a new tab, or your score cannot be recorded.</span></p>' +
      '<p><b>② 三关做完会出现登顶画面</b>，请自行截图，交到 SLS 作为完成凭证。' +
        '<span class="en">Finish all three levels, then screenshot the summit screen and submit it in SLS as proof.</span></p>' +
    '</div>' +
    '<p style="font-size:11px">姓名只存在这台装置上，不会上传，也不随分数传送。' +
      '<span class="en">Your name stays on this device. It is never uploaded and never sent with your score.</span></p>' +
    '<div class="row"><button class="btn" id="nameGo" type="button">继续 Continue</button></div>');
  const go = ()=>{
    S.name = $('inName').value.trim() || '同学';
    S.cls  = $('inCls').value.trim();
    save(); scrAvShow();
  };
  $('nameGo').addEventListener('click', go);
  $('inCls').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });

}

function scrAvShow(){
  paintScr('scrAv',
    '<h1>选一个角色</h1>' +
    '<p>这个角色会陪你爬完三关。<span class="en">Pick the character who climbs with you. You can change it later.</span></p>' +
    '<div class="avs" id="avs"></div>' +
    '<div class="row"><button class="btn" id="avGo" type="button">出发 Start climbing</button></div>');
  const wrap = $('avs');
  AV_NAMES.forEach((nm,i)=>{
    const b = el('button','av' + (i===S.av?' on':''));

    const ic = el('i'); paintAvatar(ic, i, 0, 56);
    b.appendChild(ic);
    b.appendChild(el('u', null, esc(nm)));

function scrMenuShow(){
  const all = LEVELS.every((_,i)=>lvDone(i));
  paintScr('scrMenu',
    '<h1>⛰️ 书山登顶 · 选一关</h1>' +
    '<p class="en">Pick a level — you can do them in any order, and come back later.</p>' +
    '<div class="lvs">' + LEVELS.map((L,i)=>
      '<button class="lvc' + (lvDone(i)?' done':'') + '" type="button" data-lv="' + i + '">' +
        '<span class="n">' + esc(L.n) + '</span>' +
        '<span class="t">' + esc(L.t) + '</span>' +
        '<span class="s">' + (lvDone(i)
            ? '✅ <b>' + lvScore(i) + '</b> / ' + lvMax(i) + ' 分'
            : (donePanels() && (S.marks[i]||[]).some(v=>v!=null)
                ? '继续 · ' + (S.marks[i]||[]).filter(v=>v!=null).length + '/' + L.panels.length + ' 版面'

        ? '<b style="color:var(--green)">已达登顶线 ' + PASS + ' 分 ✅</b>'
        : '登顶线 <b style="color:var(--gold)">' + PASS + ' 分</b>，还差 ' +
          '<b style="color:#ffb3b3">' + (PASS - total()) + ' 分</b>') +

  if(all) $('mTop').addEventListener('click', scrTopShow);
